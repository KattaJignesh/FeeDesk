
name: pappa_project
description: "FeeDesk - Offline Fee Management System"
publish_to: 'none'

version: 2.0.0+1
environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^13.3.2
  excel: ^4.0.6
  intl: ^0.20.3
  pdf: ^3.12.0
  printing: ^5.14.3
  fl_chart: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/branding/app_icon.png
    - assets/branding/feedesk_brand_artwork.png

flutter_launcher_icons:
  android: true
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 48
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0B1F4D"
  adaptive_icon_foreground: assets/branding/app_icon.png
